name: Optimize Drive Folder

on:
  workflow_dispatch:
    inputs:
      drive_folder:
        description: 'Google Drive folder link or ID'
        required: true
  repository_dispatch:
    types: [optimize-drive-folder]

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run optimizer
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          DRIVE_FOLDER: ${{ github.event.inputs.drive_folder || github.event.client_payload.drive_folder }}
        run: python main.py --drive-folder "$DRIVE_FOLDER"

      - name: Persist alt text map
        run: |
          if ! git diff --quiet -- alt_text_map.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add alt_text_map.json
            git commit -m "Update alt_text_map.json [skip ci]"
            git push
          else
            echo "No alt_text_map.json changes to commit."
          fi
